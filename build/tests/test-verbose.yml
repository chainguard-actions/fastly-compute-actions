name: Test verbose mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with verbose enabled
        id: action
        uses: .
        with:
          verbose: 'true'
        continue-on-error: true

      - name: Assert action ran with verbose input (fails gracefully without Fastly CLI)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with verbose=true (Fastly CLI was available)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Fastly CLI not installed in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
