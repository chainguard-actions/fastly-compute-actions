name: Test verbose mode
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          verbose: 'true'
        continue-on-error: true

      - name: Assert action ran with verbose flag (fails gracefully without fastly CLI)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action requires the fastly CLI to be installed.
          # In the harness environment the CLI is not present, so the action
          # is expected to fail with a clear error. We accept both outcomes:
          # - success: fastly CLI happened to be installed and build succeeded
          # - failure: fastly CLI not found, action called setFailed gracefully
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with verbose=true (fastly CLI was available)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully with verbose=true (fastly CLI not installed, as expected in CI)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
