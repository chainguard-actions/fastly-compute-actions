name: Test basic usage - fastly compute build
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock fastly CLI
        run: |
          mkdir -p /tmp/mock-bin
          cat > /tmp/mock-bin/fastly << 'EOF'
          #!/bin/sh
          # Mock fastly CLI
          echo "fastly mock: called with args: $*"
          # Handle 'fastly version' (checkBin call)
          if [ "$1" = "version" ]; then
            echo "Fastly CLI version 10.0.0 (mock)"
            exit 0
          fi
          # Handle 'fastly compute build --non-interactive'
          if [ "$1" = "compute" ] && [ "$2" = "build" ]; then
            echo "Building Compute package (mock)..."
            echo "SUCCESS: package built"
            exit 0
          fi
          echo "Unknown command: $*"
          exit 1
          EOF
          chmod +x /tmp/mock-bin/fastly
          echo "/tmp/mock-bin" >> $GITHUB_PATH

      - id: action
        uses: .
        with:
          project_directory: './'

      - name: Assert action succeeded
        run: |
          echo "PASS: action completed successfully with mock fastly CLI"
