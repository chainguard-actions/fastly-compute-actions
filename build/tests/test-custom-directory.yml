name: Test custom project directory
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a subdirectory to use as project_directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/compute-project"
          echo "# Placeholder Compute project" > "$GITHUB_WORKSPACE/tests/fixtures/compute-project/README.md"

      - id: action
        uses: .
        with:
          project_directory: 'tests/fixtures/compute-project'
          verbose: 'false'
        continue-on-error: true

      - name: Assert action ran with custom project directory
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (fastly CLI not installed or no fastly.toml)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom project directory"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
