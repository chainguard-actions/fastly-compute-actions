name: Test setup with explicit token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
      - name: Assert Fastly CLI is installed
        run: |
          echo "Checking Fastly CLI installation..."
          if ! command -v fastly >/dev/null 2>&1; then
            echo "FAIL: fastly CLI not found in PATH"
            exit 1
          fi
          VERSION=$(fastly version 2>&1 || true)
          echo "fastly version: $VERSION"
          echo "PASS: Fastly CLI is installed"
