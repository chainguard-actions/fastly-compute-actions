name: Test with explicit GitHub token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cli_version: 'latest'
          viceroy_version: 'latest'
          token: ${{ github.token }}
        continue-on-error: true
      - name: Assert action ran with token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if command -v fastly >/dev/null 2>&1; then
              echo "PASS: fastly CLI is installed using provided token"
              fastly version || true
            else
              echo "FAIL: action succeeded but fastly CLI not found on PATH"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (likely API or network issue in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
