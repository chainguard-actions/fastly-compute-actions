name: Test with GitHub token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
        continue-on-error: true
      - name: Assert fastly CLI is installed or action ran with token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded with token, checking fastly binary..."
            if ! command -v fastly >/dev/null 2>&1; then
              echo "FAIL: fastly binary not found in PATH after successful action"
              exit 1
            fi
            echo "fastly version: $(fastly version 2>&1 || true)"
            echo "PASS: fastly CLI is installed using authenticated GitHub API"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/API issue in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
