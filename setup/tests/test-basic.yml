name: Test basic usage - install latest Fastly CLI and Viceroy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cli_version: 'latest'
          viceroy_version: 'latest'
      - name: Assert fastly CLI is installed and on PATH
        run: |
          echo "Checking fastly CLI is available..."
          if ! command -v fastly >/dev/null 2>&1; then
            echo "FAIL: fastly CLI not found on PATH"
            exit 1
          fi
          echo "fastly version output:"
          fastly version
          echo "PASS: fastly CLI is installed"
      - name: Assert viceroy is installed and on PATH
        run: |
          echo "Checking viceroy is available..."
          if ! command -v viceroy >/dev/null 2>&1; then
            echo "FAIL: viceroy not found on PATH"
            exit 1
          fi
          echo "viceroy version output:"
          viceroy --version
          echo "PASS: viceroy is installed"
