name: Test specific CLI version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          cli_version: 'v10.15.0'
          token: ${{ github.token }}

      - name: Assert Fastly CLI is installed at specified version
        run: |
          echo "Checking fastly CLI is on PATH..."
          if ! command -v fastly >/dev/null 2>&1; then
            echo "FAIL: fastly CLI not found on PATH"
            exit 1
          fi
          echo "PASS: fastly CLI found at $(command -v fastly)"

      - name: Assert Fastly CLI version matches requested
        run: |
          echo "Running fastly version..."
          VERSION_OUTPUT=$(fastly version 2>&1 || true)
          echo "Output: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "FAIL: fastly version produced no output"
            exit 1
          fi
          if echo "$VERSION_OUTPUT" | grep -q "10.15.0"; then
            echo "PASS: version 10.15.0 confirmed"
          else
            echo "FAIL: expected version 10.15.0 but got: $VERSION_OUTPUT"
            exit 1
          fi
