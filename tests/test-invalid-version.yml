name: Test invalid CLI version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          cli_version: 'not-a-valid-semver'

      - name: Assert action failed due to invalid semver
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The setup step validates the semver string and calls setFailed
          # when it is not a valid SemVer, so the action must fail.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected for invalid semver input"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed for invalid semver 'not-a-valid-semver'"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
