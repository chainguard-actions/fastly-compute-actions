name: Test invalid CLI version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          # Provide an invalid semver string — setup/index.js calls
          # core.setFailed() when semver.valid() returns null.
          cli_version: 'not-a-valid-version'
          project_directory: './'

      - name: Assert action failed gracefully on invalid version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action MUST fail because 'not-a-valid-version' is not a valid
          # SemVer string. A success here would indicate the validation is broken.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected for invalid version string"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed for invalid version string"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
