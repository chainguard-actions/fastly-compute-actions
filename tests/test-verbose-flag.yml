name: Test action with verbose flag enabled
on:
  workflow_dispatch:

jobs:
  test-verbose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run full action with verbose enabled (expected to fail without Fastly project)
        id: action
        uses: .
        continue-on-error: true
        with:
          project_directory: './'
          cli_version: latest
          viceroy_version: latest
          service_id: default
          verbose: 'true'
          token: ${{ github.token }}

      - name: Assert action ran with verbose flag
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action will fail at build/deploy without a real Fastly project,
          # but it should not fail due to the verbose flag itself
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with verbose flag"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no Fastly project/credentials), verbose flag accepted"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
