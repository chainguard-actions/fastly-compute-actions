name: Test verbose flag is accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          cli_version: 'latest'
          viceroy_version: 'latest'
          verbose: 'true'

      - name: Assert action ran with verbose flag
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should accept the verbose=true input without crashing.
          # The setup (pre) step downloads the Fastly CLI; the build (main) step
          # will fail because there is no fastly.toml Compute project in the workspace.
          # Either success or failure is acceptable — skipped is not.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with verbose flag, outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
