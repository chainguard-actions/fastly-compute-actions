name: Test specific CLI version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          # Specify a known stable CLI version; setup should download it.
          # Build will fail without a real Compute project — that is expected.
          cli_version: 'v10.15.0'
          project_directory: './'

      - name: Assert action ran with specific CLI version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail at the build step because there is
          # no fastly.toml in the workspace. The important thing is that it
          # ran (not skipped) and did not crash the runner.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no Compute project)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
