name: Test setup with latest CLI version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          cli_version: 'latest'
          viceroy_version: 'latest'

      - name: Assert action ran (setup installs CLI; build fails without a Compute project)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The setup (pre) step should succeed — it downloads the Fastly CLI from
          # the public fastly/cli GitHub release. The build (main) step will fail
          # because there is no fastly.toml Compute project in the workspace.
          # Either outcome is acceptable here; what matters is that the action
          # ran and did not produce an unexpected/skipped outcome.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert fastly CLI was installed by the pre step
        run: |
          if command -v fastly >/dev/null 2>&1; then
            echo "PASS: fastly CLI is available on PATH"
            fastly version || true
          else
            echo "WARN: fastly CLI not found on PATH (may not have been cached yet)"
          fi
