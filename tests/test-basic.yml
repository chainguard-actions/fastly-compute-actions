name: Test basic usage (default inputs)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          # No Fastly token or real project — action will fail at build/deploy,
          # but the setup (CLI install) phase should complete.
          project_directory: './'

      - name: Assert action ran (setup installs CLI; build fails without a real project)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because there is no fastly.toml /
          # Compute project in the workspace. What we verify is that it ran
          # (not skipped) and failed gracefully rather than crashing the runner.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no Compute project)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly — acceptable"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
