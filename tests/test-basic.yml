name: Test basic usage with token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project_directory: './'
          cli_version: 'latest'
          viceroy_version: 'latest'
          service_id: 'default'
          comment: 'test deployment'
          version: ''
          verbose: 'false'
          token: 'fake-github-token'
      - name: Assert action ran (setup phase completed or failed gracefully)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action may fail because there is no real Fastly service,
          # but it should not fail due to missing inputs.
          # We accept both success and failure outcomes here.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with all inputs including token"
