name: Test full action fails gracefully without a Fastly project
on:
  workflow_dispatch:

jobs:
  test-full-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run full compute action (expected to fail without a real Fastly project)
        id: action
        uses: .
        continue-on-error: true
        with:
          project_directory: './'
          cli_version: latest
          viceroy_version: latest
          service_id: default
          verbose: 'false'
          token: ${{ github.token }}

      - name: Assert action ran and failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no Fastly project or credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
