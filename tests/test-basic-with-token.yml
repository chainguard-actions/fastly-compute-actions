name: Test basic usage with token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project_directory: './'
          cli_version: 'latest'
          viceroy_version: 'latest'
          service_id: 'default'
          comment: 'test deployment'
          version: ''
          verbose: 'false'
          token: ${{ github.token }}
      - name: Assert action ran (setup step attempted)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail without real Fastly credentials/project,
          # but it should have started (not be skipped or missing).
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome: ${{ steps.action.outcome }})"
