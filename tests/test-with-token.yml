name: Test with token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal fastly.toml for action
        run: |
          mkdir -p ./compute-project
          cat > ./compute-project/fastly.toml <<'EOF'
          manifest_version = 2
          name = "test-project"
          description = "Test project"
          authors = ["test@example.com"]
          language = "rust"

          [scripts]
            build = "echo 'build skipped'"

          [local_server]

          [setup]
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          project_directory: './compute-project'
          cli_version: 'latest'
          viceroy_version: 'latest'
          service_id: 'test-service-id'
          comment: 'ci test run'
          version: 'latest'
          verbose: 'true'
          token: 'test-github-token-value'
      - name: Assert action ran with token input
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action will fail without a real Fastly API token, but it must
          # not be skipped — it should attempt to run.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with token input (outcome: ${{ steps.action.outcome }})"
