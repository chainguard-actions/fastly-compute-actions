name: Test latest CLI version (default)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          cli_version: 'latest'
          viceroy_version: 'latest'
          project_directory: './'

      - name: Assert action ran (setup fetches latest CLI from GitHub releases)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # cli_version=latest triggers a GitHub API call to fetch the latest
          # Fastly CLI release. The setup phase should succeed (real GitHub API
          # is available). The build phase will fail because there is no
          # fastly.toml in the workspace — that is expected.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully after setup (no Fastly project present)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
