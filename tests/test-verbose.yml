name: Test verbose mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal fastly.toml for testing
        run: |
          mkdir -p test-project
          cat > test-project/fastly.toml <<'EOF'
          manifest_version = 2
          name = "test-project"
          description = "A test Compute project"
          authors = ["test@example.com"]
          language = "other"
          [scripts]
            build = "echo 'build complete'"
          EOF
      - id: action
        uses: .
        with:
          project_directory: './test-project'
          verbose: 'true'
          token: 'fake-token-for-testing'
        continue-on-error: true
      - name: Assert action ran with verbose flag
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action is expected to fail without valid Fastly credentials,
          # but it should at least attempt to run (not be skipped)
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran in verbose mode (outcome: $OUTCOME)"
