name: Test setup with a specific CLI version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          # Pin to a known stable release of the Fastly CLI
          cli_version: 'v10.15.0'
          viceroy_version: 'latest'

      - name: Assert action ran (setup installs pinned CLI; build fails without a Compute project)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The setup (pre) step should succeed — it downloads the pinned Fastly CLI
          # release from the public fastly/cli GitHub repo. The build (main) step will
          # fail because there is no fastly.toml Compute project in the workspace.
          # Either outcome is acceptable; what matters is that the action ran.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert fastly CLI is available after setup
        run: |
          if command -v fastly >/dev/null 2>&1; then
            echo "PASS: fastly CLI is available on PATH"
            fastly version || true
          else
            echo "WARN: fastly CLI not found on PATH"
          fi
