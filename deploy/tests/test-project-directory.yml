name: Test with project_directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake project directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/my-compute-project"
          echo '[service]' > "$GITHUB_WORKSPACE/my-compute-project/fastly.toml"
          echo 'name = "test-service"' >> "$GITHUB_WORKSPACE/my-compute-project/fastly.toml"
          echo 'language = "rust"' >> "$GITHUB_WORKSPACE/my-compute-project/fastly.toml"

      - id: action
        uses: .
        continue-on-error: true
        with:
          project_directory: './my-compute-project'
        env:
          FASTLY_API_TOKEN: fake-token-for-testing

      - name: Assert action ran and failed gracefully with custom project_directory
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (Fastly CLI not installed)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (Fastly CLI may be installed)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
