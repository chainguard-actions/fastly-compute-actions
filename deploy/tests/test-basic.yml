name: Test basic usage (no Fastly CLI)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          project_directory: './'

      - name: Assert action ran and failed gracefully (no Fastly CLI available)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (Fastly CLI not installed)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (Fastly CLI was available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
