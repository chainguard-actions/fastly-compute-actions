name: Test basic usage (default inputs)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          project_directory: './'

      - name: Assert action ran and failed gracefully (no fastly CLI available)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Without the Fastly CLI installed, the action is expected to fail.
          # We assert it failed (gracefully) rather than errored unexpectedly.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (fastly CLI not available)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (fastly CLI was available and deploy worked)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
