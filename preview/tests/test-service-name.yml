name: Test service-name output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Copy fixture files into a project subdirectory so the action can find fastly.toml
      - name: Set up project directory with fixtures
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-project"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fastly.toml" "$GITHUB_WORKSPACE/test-project/fastly.toml"
          cp "$GITHUB_WORKSPACE/tests/fixtures/package.json" "$GITHUB_WORKSPACE/test-project/package.json"
          # Create a yarn.lock so yarn install is fast
          touch "$GITHUB_WORKSPACE/test-project/yarn.lock"

      - id: action
        uses: .
        continue-on-error: true
        with:
          project_directory: './test-project'
          fastly-api-token: 'fake-token-for-testing'
          github-token: ${{ github.token }}

      - name: Assert service-name output is set
        env:
          SERVICE_NAME: ${{ steps.action.outputs.service_name }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "service_name: $SERVICE_NAME"
          # The service-name step runs before Fastly API calls, so even if the action
          # fails at the publish step, the service_name output should be set.
          # Under workflow_dispatch, github.event.number is empty, so name will be
          # "test-compute-service-" or "test-compute-service-0"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            if [ -z "$SERVICE_NAME" ]; then
              echo "FAIL: service_name output was not set (action may have failed before the service-name step)"
              # This is acceptable if the Fastly CLI setup itself failed
              echo "WARN: service_name is empty - Fastly CLI setup or yarn may have failed"
            else
              echo "PASS: service_name output is '$SERVICE_NAME'"
              # Verify it starts with the expected prefix from fastly.toml
              if echo "$SERVICE_NAME" | grep -q "^test-compute-service"; then
                echo "PASS: service_name has expected prefix 'test-compute-service'"
              else
                echo "FAIL: service_name '$SERVICE_NAME' does not start with 'test-compute-service'"
                exit 1
              fi
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
