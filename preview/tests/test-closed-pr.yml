name: Test closed PR (service deletion) path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    # Simulate a closed pull_request event context
    env:
      GITHUB_EVENT_NAME: pull_request
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Install yq so the action's service-name step can read fastly.toml
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      # Copy fixture project into workspace so the action can find fastly.toml
      - name: Set up fixture project
        run: |
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/project" "$GITHUB_WORKSPACE/test-project"
          ls -la "$GITHUB_WORKSPACE/test-project/"

      - id: action
        uses: .
        continue-on-error: true
        with:
          project_directory: ./test-project
          fastly-api-token: fake-token-for-testing
          github-token: ${{ github.token }}

      - name: Assert action ran (closed PR path - delete service)
        env:
          SERVICE_NAME: ${{ steps.action.outputs.service_name }}
          DOMAIN: ${{ steps.action.outputs.domain }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "service_name: $SERVICE_NAME"
          echo "domain: $DOMAIN"
          # The action should either succeed or fail gracefully (no real Fastly token)
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real Fastly token/CLI)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
