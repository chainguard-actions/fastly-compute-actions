name: Test service-name output construction
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Set up fixture project with fastly.toml containing name = "test-service"
      - name: Set up fixture project directory
        run: |
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/project" "$GITHUB_WORKSPACE/test-project"

      # The action reads fastly.toml with yq to build the service name.
      # It will fail at the Fastly API call stage (no real token), but the
      # service_name output is set before that point.
      - id: action
        uses: .
        continue-on-error: true
        with:
          project_directory: ./test-project
          fastly-api-token: fake-fastly-token
          github-token: ${{ github.token }}

      - name: Assert service_name output contains the project name from fastly.toml
        env:
          SERVICE_NAME: ${{ steps.action.outputs.service_name }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "service_name: $SERVICE_NAME"
          # The service_name is set before the Fastly API calls, so it may be
          # available even if the action ultimately fails.
          # Under workflow_dispatch, github.event.number is empty, so the name
          # will be "test-service-" (name from fastly.toml + dash + empty number).
          if [ -n "$SERVICE_NAME" ]; then
            if echo "$SERVICE_NAME" | grep -q "test-service"; then
              echo "PASS: service_name '$SERVICE_NAME' contains expected project name"
            else
              echo "FAIL: service_name '$SERVICE_NAME' does not contain 'test-service'"
              exit 1
            fi
          else
            # service_name may be empty if the action failed before setting it
            # (e.g. yarn or CLI setup failed). This is acceptable.
            if [ "$OUTCOME" = "failure" ]; then
              echo "PASS: action failed gracefully (expected without real Fastly token/CLI)"
            else
              echo "FAIL: action succeeded but service_name output is empty"
              exit 1
            fi
          fi
