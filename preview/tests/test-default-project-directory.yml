name: Test default project directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action defaults to './' as project_directory and reads fastly.toml
      # from there. We create a fastly.toml in the workspace root.
      - name: Set up fastly.toml in workspace root
        run: |
          cat > "$GITHUB_WORKSPACE/fastly.toml" << 'EOF'
          authors = ["test@example.com"]
          description = "Test Fastly Compute service"
          language = "javascript"
          manifest_version = 2
          name = "default-dir-service"
          service_id = ""
          EOF
          cat > "$GITHUB_WORKSPACE/package.json" << 'EOF'
          {
            "name": "test-fastly-project",
            "version": "1.0.0"
          }
          EOF

      # The action will fail at Fastly API calls (no real token), but we test
      # that it starts correctly with the default project directory.
      - id: action
        uses: .
        continue-on-error: true
        with:
          fastly-api-token: fake-fastly-token
          github-token: ${{ github.token }}

      - name: Assert action ran with default project directory
        env:
          SERVICE_NAME: ${{ steps.action.outputs.service_name }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "service_name: $SERVICE_NAME"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SERVICE_NAME" ]; then
              echo "FAIL: action succeeded but service_name output is empty"
              exit 1
            fi
            echo "PASS: service_name='$SERVICE_NAME'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real Fastly token)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
