name: Test basic usage (non-closed PR path)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action reads fastly.toml with yq to build the service name.
      # We copy the fixture project into the workspace so the action can find it.
      - name: Set up fixture project directory
        run: |
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/project" "$GITHUB_WORKSPACE/test-project"

      # The action calls fastly CLI (real Fastly API) which will fail without a
      # real token. We use continue-on-error and assert on the outcome gracefully.
      - id: action
        uses: .
        continue-on-error: true
        with:
          project_directory: ./test-project
          fastly-api-token: fake-fastly-token
          github-token: ${{ github.token }}

      - name: Assert service-name output or graceful failure
        env:
          SERVICE_NAME: ${{ steps.action.outputs.service_name }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "service_name: $SERVICE_NAME"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$SERVICE_NAME" ]; then
              echo "FAIL: action succeeded but service_name output is empty"
              exit 1
            fi
            echo "PASS: service_name='$SERVICE_NAME'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real Fastly token)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
