name: 'Branch Preview'
description: 'Preview Fastly Service'

inputs:
  project_directory:
    description: 'Directory of the project to build, relative to the repository root.'
    required: false
    default: './'
  fastly-api-token:
    description: 'The Fastly API token to use for interacting with Fastly API'
    required: true
  github-token:
    description: 'The GitHub token to use for downloading the Fastly CLI'
    required: true

outputs:
  domain:
    description: "Preview domain for Fastly Compute Service"
    value: ${{ steps.domain.outputs.DOMAIN }}
  service_name:
    description: "Preview service name for Fastly Compute Service"
    value: ${{ steps.service-name.outputs.SERVICE_NAME }}

runs:
  using: "composite"
  steps:

    # Download Fastly CLI
    - name: Set up Fastly CLI
      uses: fastly/compute-actions/setup@3b4355cb74cc7428a92dad1194bd564898372d55 # v12
      with:
        token: ${{ inputs.github-token }}
        cli_version: 'latest'
    - run: yarn
      working-directory: ${{ inputs.project_directory }}
      shell: bash

    # Create a new Fastly Service name with the PR number appended
    - name: Set service-name
      id: service-name
      working-directory: ${{ inputs.project_directory }}
      env:
        EVENT_NUMBER: ${{ github.event.number }}
      run: |
        raw="$(yq '.name' fastly.toml)-${EVENT_NUMBER}"
        safe="$(printf '%s' "$raw" | tr -d '\n\r')"
        echo "SERVICE_NAME=$safe" >> "$GITHUB_OUTPUT"
      shell: bash

    # Delete the Fastly Service
    - if: github.event.action == 'closed'
      working-directory: ${{ inputs.project_directory }}
      env:
        FASTLY_API_TOKEN: ${{ inputs.fastly-api-token }}
        SERVICE_NAME: ${{ steps.service-name.outputs.SERVICE_NAME }}
        fastly_api_token: ${{ inputs.fastly-api-token }}
      run: fastly service delete --quiet --service-name "$SERVICE_NAME" --force --token "$FASTLY_API_TOKEN" || true
      shell: bash

    # Deploy to Fastly and let Fastly choose a subdomain of edgecompute.app to attach to the service
    - if: github.event.action != 'closed'
      working-directory: ${{ inputs.project_directory }}
      env:
        FASTLY_API_TOKEN: ${{ inputs.fastly-api-token }}
        SERVICE_NAME: ${{ steps.service-name.outputs.SERVICE_NAME }}
        fastly_api_token: ${{ inputs.fastly-api-token }}
      run: |
        fastly compute publish --verbose -i --token "$FASTLY_API_TOKEN" --service-name "$SERVICE_NAME"
      shell: bash

    # Retrieve the newly created domain for the service and add it to the pull-request summary
    - if: github.event.action != 'closed'
      working-directory: ${{ inputs.project_directory }}
      env:
        FASTLY_API_TOKEN: ${{ inputs.fastly-api-token }}
        SERVICE_NAME: ${{ steps.service-name.outputs.SERVICE_NAME }}
      run: fastly domain list --quiet --version latest --json --service-name="$SERVICE_NAME" --token "$FASTLY_API_TOKEN" | jq -r '.[0].Name'
      shell: bash

    - if: github.event.action != 'closed'
      working-directory: ${{ inputs.project_directory }}
      name: Set domain
      shell: bash
      id: domain
      env:
        FASTLY_API_TOKEN: ${{ inputs.fastly-api-token }}
        SERVICE_NAME: ${{ steps.service-name.outputs.SERVICE_NAME }}
      run: |
        raw="$(fastly domain list --quiet --version latest --json --service-name="$SERVICE_NAME" --token "$FASTLY_API_TOKEN" | jq -r '.[0].Name')"
        safe="$(printf '%s' "$raw" | tr -d '\n\r')"
        echo "DOMAIN=$safe" >> "$GITHUB_OUTPUT"

    - if: github.event.action != 'closed'
      working-directory: ${{ inputs.project_directory }}
      shell: bash
      name: Add domain to summary
      env:
        DOMAIN: ${{ steps.domain.outputs.DOMAIN }}
      run: echo "This pull-request has been deployed to Fastly and is available at <https://${DOMAIN}> 🚀" >> $GITHUB_STEP_SUMMARY
